[project]
name = "retro-gemini"
version = "0.1.0"
description = "A terminal-based CLI for Google Gemini"
authors = [
    {name = "Henry Zhao",email = "75873192+henry-zhao-dev@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit (>=3.0.53,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[project.scripts]
retro-gemini = "retro_gemini.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
