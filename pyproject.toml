[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-gemini"
version = "0.1.0"
description = "A terminal-based CLI for Google Gemini"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
retro-gemini = "retro_gemini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
